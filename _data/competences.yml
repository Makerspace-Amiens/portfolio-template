# =====================================================================
#  MES COMPÉTENCES — alimente le radar et la page /competences/
#
#  ⚠️ Le référentiel ci-dessous est un EXEMPLE. L'équipe pédagogique
#     fournit la liste officielle de ta formation : garde les "id",
#     "nom" et "description" qu'elle donne, et remplis toi-même
#     "niveau", "justification" et "autres_preuves".
#
#  Les preuves "projets / articles / docs" sont ajoutées
#  AUTOMATIQUEMENT : il suffit d'écrire  competences: [C1, C3]
#  dans le front matter d'un projet, d'un article ou d'une doc.
# =====================================================================

referentiel: "Référentiel de compétences — exemple à remplacer"
niveau_max: 4
niveaux:                       # signification de chaque niveau (1 à niveau_max)
  - "Découverte : j'ai pratiqué une fois, avec beaucoup d'aide"
  - "Application : je sais le refaire en suivant une méthode"
  - "Maîtrise : je le fais en autonomie et je sais justifier mes choix"
  - "Expertise : je sais l'adapter à un contexte nouveau et l'expliquer à d'autres"

competences:
  - id: C1
    nom: "Analyser un besoin et rédiger un cahier des charges"
    court: "Besoin & CdC"       # libellé court affiché sur le radar (optionnel)
    description: "Identifier les attentes, les contraintes et les critères de validation d'un projet."
    niveau: 1                   # mon niveau actuel (0 à niveau_max)
    objectif: 3                 # niveau visé en fin d'année (optionnel)
    justification: |
      Pourquoi je m'attribue ce niveau, en m'appuyant sur des faits :
      ce que j'ai fait, comment, et ce qu'il me reste à travailler.
    autres_preuves:             # preuves hors du site (stage, certification…), optionnel
      - titre: "Atelier Méthodologie de projet"
        lien: "https://doc.makerspace-amiens.fr/workshops/methodologie-de-projet/"
        description: "Cahier des charges rendu et évalué."
        icon: graduation-cap

  - id: C2
    nom: "Concevoir et prototyper une solution technique"
    court: "Conception"
    description: "Proposer, comparer et réaliser des solutions répondant au besoin."
    niveau: 1
    objectif: 3

  - id: C3
    nom: "Communiquer et documenter"
    court: "Communication"
    description: "Rendre un travail compréhensible et transmissible, à l'écrit comme à l'oral."
    niveau: 1
    objectif: 3
